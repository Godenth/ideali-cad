<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ideali CAD</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5B45E0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ideali CAD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: app de celular com menu inferior; no computador o menu vira barra lateral. Mesmos tokens da página de apresentação. */
:root{
  --bg:#F6F5F8; --surface:#FFFFFF; --ink:#1B1830; --muted:#625E75; --line:#E2DFEA;
  --accent:#5B45E0; --accent-ink:#FFFFFF; --accent-soft:#EEEBFD;
  /* pigmentos: usados em pouca quantidade */
  --p1:#EF5F5A; --p2:#F0A53A; --p3:#1DAE8A; --p4:#3A96EC; --p5:#7B5CF2; --p6:#DD5A9E;
  --paint:linear-gradient(90deg,var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p6));
  --urgent:#D2433A; --ok:#1E8A5A; --warn:#B7791F; --soft:#EEF1F3;
  --c-pac:#B0236F; --c-cli:#1F66B8; --c-val:#13804F;
  --c1:var(--p4); --c2:var(--p2); --c2t:#9A5A00; --c3:var(--p5); --c4:var(--p3);
  --f-display:"Plus Jakarta Sans",system-ui,"Segoe UI",Arial,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --c-pac:#F48CC4; --c-cli:#7BBEFF; --c-val:#4FD99A;
  --bg:#121019; --surface:#1B1826; --ink:#ECEAF4; --muted:#A39FB6; --line:#2D2940; --accent:#9E8CFF; --accent-ink:#121019; --accent-soft:#2A2450; --urgent:#FF6E63; --ok:#4CC58A; --warn:#E8B04A; --soft:#221F31; --p1:#FF7B74; --p2:#F7BC5C; --p3:#3CCFA6; --p4:#62B0FF; --p5:#9E86FF; --p6:#F27AB8; --c1:var(--p4); --c2:var(--p2); --c2t:#F7BC5C; --c3:var(--p5); --c4:var(--p3); color-scheme:dark}}
:root[data-theme="dark"]{--c-pac:#F48CC4; --c-cli:#7BBEFF; --c-val:#4FD99A; --bg:#121019; --surface:#1B1826; --ink:#ECEAF4; --muted:#A39FB6; --line:#2D2940; --accent:#9E8CFF; --accent-ink:#121019; --accent-soft:#2A2450; --urgent:#FF6E63; --ok:#4CC58A; --warn:#E8B04A; --soft:#221F31; --p1:#FF7B74; --p2:#F7BC5C; --p3:#3CCFA6; --p4:#62B0FF; --p5:#9E86FF; --p6:#F27AB8; --c1:var(--p4); --c2:var(--p2); --c2t:#F7BC5C; --c3:var(--p5); --c4:var(--p3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(38rem 28rem at -5% -5%,color-mix(in srgb,var(--p6) 10%,transparent),transparent 70%),radial-gradient(34rem 26rem at 105% 8%,color-mix(in srgb,var(--p4) 10%,transparent),transparent 70%),radial-gradient(40rem 30rem at 85% 105%,color-mix(in srgb,var(--p2) 9%,transparent),transparent 70%),radial-gradient(32rem 26rem at 5% 100%,color-mix(in srgb,var(--p3) 8%,transparent),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:1.45rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body.sem-anim *{transition:none!important;animation:none!important}

/* Shell: barra lateral fixa no computador, gaveta + barra inferior no celular */
.shell{min-height:100%}
.side{position:fixed;top:0;bottom:0;left:0;width:252px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));z-index:40;transform:translateX(-102%);transition:transform .22s ease;overflow-y:auto}
.shell.open .side{transform:none;box-shadow:0 0 40px #0004}
.scrim{display:none}
.shell.open .scrim{display:block;position:fixed;inset:0;background:color-mix(in srgb,#000 40%,transparent);z-index:35}
.content{min-width:0;min-height:100%}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.side .brand{padding:4px 10px 14px}
.side .grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:14px 12px 6px;font-weight:600}
.side .it{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500;text-align:left}
.side .it svg{width:20px;height:20px;flex:none}
.side .it:hover{color:var(--ink);background:var(--soft)}
.side .it.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .badge{margin-left:auto;font:600 .7rem var(--f-mono);background:var(--urgent);color:#fff;border-radius:99px;padding:1px 7px}
.side .plan{margin-top:auto;background:var(--soft);border-radius:14px;padding:14px;display:grid;gap:8px;font-size:.85rem}
.side .me{display:flex;align-items:center;gap:10px;padding:12px 6px 0;font-size:.85rem;min-width:0}
.side .me .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:none;margin-inline:auto}
.top h1{flex:1;min-width:0;font-size:1.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .search{max-width:300px;padding:.55em .9em}
.top .dk{display:none}
.top .spacer{flex:1}
.top .search{max-width:320px}
.tnav{display:none;border-top:1px solid var(--line)}
.tnav-in{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;max-width:none;margin-inline:auto;padding:8px 22px}
.tnav-in::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.tnav button{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:10px;border:0;background:none;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer}
.tnav button svg{width:18px;height:18px}
.tnav button:hover{color:var(--ink);background:var(--soft)}
.tnav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.bnav button{position:relative}.bnav .badge{position:absolute;top:2px;left:calc(50% + 6px);font:700 .66rem var(--f-mono);color:#fff;border-radius:99px;padding:1px 6px}
.tnav .badge{font:600 .68rem var(--f-mono);background:var(--urgent);color:#fff;border-radius:99px;padding:1px 6px}
.main{padding:16px 16px 110px;max-width:none;margin-inline:auto;width:100%;display:grid;gap:16px;align-content:start}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 2px;font-size:.7rem;color:var(--muted);cursor:pointer;border-radius:10px}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:var(--accent);font-weight:600}
.bnav .plus{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.7rem;margin:-18px auto 0;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.bnav button:disabled{opacity:.45}
@media (min-width:960px){
  .content{margin-left:0}
  .bnav,.menu-btn,.scrim,.top .mb{display:none!important}
  .top .dk{display:inline-flex}
  .main{padding:24px 28px 48px}
  .top-in{padding:12px 28px}
  .tnav{display:block}
}

/* Dashboard */
.cid-uf{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;align-items:start}
.tp-grid{display:grid;gap:16px;align-items:start}@media (min-width:1100px){.tp-grid{grid-template-columns:minmax(0,1fr) 380px}}
.tp-list{display:grid;gap:8px}
.pg-ops{display:flex;flex-wrap:wrap;gap:6px}.pg-ck{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}.pg-ck:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tp-extra{display:grid;gap:16px;align-items:start}

.tp-li{display:grid;grid-template-columns:minmax(0,1fr) 170px 160px auto 36px;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tp-li.off{opacity:.6}
.tp-li input,.tp-li select{min-width:0;width:100%}
.tp-val{display:flex;align-items:center;gap:6px}
.tp-val span{color:var(--muted);font:600 .8rem var(--f-mono)}
.tp-val input{text-align:right;font-family:var(--f-mono)}
.tp-at{font-size:.85rem;white-space:nowrap}
.tp-x{width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;font-size:1rem;display:grid;place-items:center}
.tp-x:hover{color:var(--urgent);background:color-mix(in srgb,var(--urgent) 10%,transparent);border-color:color-mix(in srgb,var(--urgent) 25%,transparent)}
.tp-x:disabled{opacity:.4;cursor:default}
@media (max-width:699px){.tp-li{grid-template-columns:minmax(0,1fr) 86px auto;gap:6px;position:relative;padding-top:8px}.tp-li input.tp-nome:not([type=checkbox]){width:calc(100% - 42px)}.tp-li .tp-x{position:absolute;top:10px;right:8px}.tp-li select{padding-left:.5em;padding-right:.1em;font-size:.9rem}.tp-at{font-size:.78rem;gap:4px}.tp-li .tp-val input{padding-inline:.5em}.tp-nome{grid-column:1/-1}.tp-val span{display:none}}
.msg-cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;border:1px solid var(--line);font:inherit;color:inherit;background:linear-gradient(100deg,color-mix(in srgb,var(--p3) 10%,var(--surface)),var(--surface) 60%)}
.msg-cta:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.msg-cta .t{display:grid;gap:2px;flex:1;min-width:0}.msg-cta .t span{color:var(--muted);font-size:.85rem}
.msg-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:color-mix(in srgb,var(--p3) 18%,var(--surface));flex:none}
.msg-tabs{max-width:none}
@media (max-width:699px){.cfg-tabs.msg-tabs{display:flex;overflow-x:auto}.cfg-tabs.msg-tabs button{flex-direction:row;padding:8px 12px;font-size:.82rem;flex:0 0 auto}}
.msg-grid{display:grid;gap:12px}
@media (min-width:960px){.msg-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.msg-card{display:grid;gap:10px;align-content:start;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.msg-tit{display:grid;gap:2px;font-weight:600;font-size:.92rem}
.msg-txt{white-space:pre-wrap;font-size:.93rem;line-height:1.5;background:color-mix(in srgb,#25D366 7%,var(--bg));border:1px solid color-mix(in srgb,#25D366 18%,var(--line));border-radius:12px 12px 12px 4px;padding:10px 12px}
.msg-acts{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.msg-var{display:inline-flex;align-items:center;gap:6px}.msg-var .icon-btn{width:32px;height:32px}
.msg-ev h2{margin:0}
.msg-txt.minha{background:color-mix(in srgb,var(--accent) 7%,var(--bg));border-color:color-mix(in srgb,var(--accent) 22%,var(--line))}
.msg-var .tag{margin-left:4px}
details.mm>summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none}
details.mm>summary::-webkit-details-marker{display:none}
details.mm>summary .t{display:grid;gap:2px;flex:1;min-width:0}
details.mm>summary::after{content:"▾";color:var(--muted);transition:transform .2s}
details.mm[open]>summary::after{transform:rotate(180deg)}
.mm-list{display:grid;gap:8px}
.mm-li{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:6px;align-items:start}
.mm-li textarea{width:100%;padding:.7em .85em;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-height:76px;resize:vertical;font:inherit;color:inherit}
.mm-vars{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mm-var{font:500 .75rem var(--f-mono);padding:.3em .6em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer}
.mm-hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.banner.lemb .icon-btn{width:30px;height:30px}
.imp-box{padding:12px;border-radius:12px;border:1px dashed var(--line);background:var(--bg)}
.imp-box .grid2{align-items:start}.imp-box .fld{align-content:start}
.rd-grid{display:grid;gap:16px;align-items:start}
@media (min-width:960px){.rd-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.li.rd-sel{outline:2px solid var(--accent);border-radius:12px}
.rd-av{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;font-size:.85rem;flex:none}
.rd-st{letter-spacing:1px}
.rd-lucro{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}.rd-lucro b{font-size:1.3rem}
.rd-sigilo{padding:12px 14px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 5%,var(--surface));display:grid;gap:8px}
.rd-sigilo ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}
.rd-fila{display:grid;gap:8px}
.rd-cand{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);transition:all .3s}
.rd-cand .t{display:grid;gap:2px;flex:1;min-width:0}
.rd-cand.fila{opacity:.5}.rd-cand.fechado{opacity:.45}
.rd-cand.aceitou{border-color:var(--c-val);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-val) 25%,transparent);transform:scale(1.01)}
.rd-cand.aceitou .rd-cst{color:var(--c-val);font-weight:800}
.rd-cst{font-size:.85rem;white-space:nowrap;display:flex;align-items:center;gap:6px}
.rd-pulse{width:9px;height:9px;border-radius:50%;background:var(--p2);display:inline-block;animation:rdp 1s infinite}
@keyframes rdp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--p2) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.rd-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:.72rem;color:var(--muted)}
.rd-steps span{display:grid;gap:6px;text-align:center}
.rd-steps i{height:6px;border-radius:6px;background:var(--line)}
.rd-steps .ok i{background:var(--c-val)}.rd-steps .on i{background:var(--accent)}.rd-steps .on{color:var(--accent);font-weight:700}.rd-steps .ok{color:var(--ink)}
.rd-star{border:0;background:none;font-size:1.4rem;color:var(--line);cursor:pointer;padding:0 2px}.rd-star.on{color:#F0A53A}
.rd-oferta{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.rd-cards{display:grid;gap:14px}
@media (min-width:700px){.rd-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.rd-cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rd-perfil .row{align-items:center}
.rd-fav{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:50%;width:40px;height:40px;font-size:1.2rem;color:var(--line);cursor:pointer;flex:none}.rd-fav.on{color:#F0A53A;border-color:#F0A53A}
.rd-chips{display:flex;flex-wrap:wrap;gap:6px}.rd-chips span{font-size:.75rem;padding:.3em .7em;border-radius:999px;background:var(--soft);color:var(--muted)}.rd-chips .sw{background:var(--accent-soft);color:var(--accent);font-weight:700}
.rd-on{color:var(--c-val);font-weight:700}
.rd-port{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rd-pi{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#111827;padding:0;cursor:pointer;display:block;width:100%}
.rd-pi img,.rd-pi video,.rd-pi svg{width:100%;height:100%;object-fit:cover;display:block}
.rd-pi .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:.72rem;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-pi .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.rd-pi .play span{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:#111}
.rd-pi .vid{position:absolute;top:6px;left:6px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.65);color:#fff;font-size:.66rem;font-weight:700;font-family:var(--mono,monospace)}
.rd-pw{position:relative}.rd-pw .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:26px;padding:0;cursor:pointer}
.rd-padd{aspect-ratio:4/3;border-radius:12px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:.8rem;font-weight:600;position:relative;cursor:pointer;text-align:center;padding:6px}
.rd-padd input{position:absolute;inset:0;opacity:0;cursor:pointer}
.rd-lb{position:fixed;inset:0;z-index:300;background:rgba(5,6,12,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.rd-lb .box{width:min(960px,100%);max-height:78vh;display:flex;justify-content:center}
.rd-lb .box>*{max-width:100%;max-height:78vh;border-radius:14px;display:block}
.rd-lb .box svg{width:100%;height:auto}
.rd-lb p{color:#fff;margin:0;text-align:center}
.rd-lb .fecha{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer}
.rd-lb .nav{display:flex;gap:10px}
.li-arq{flex-wrap:wrap;row-gap:8px}.li-arq>.row{margin-left:auto;flex-wrap:wrap;justify-content:flex-end}

function ultimosMeses(n){return mesesAte(monthOf(today()),n);}
function mesesAte(end,n){var m=end,out=[];for(var i=0;i<n;i++){out.unshift(m);m=prevMonth(m);}return out;}
function inPer(d){return !!d&&(ui.per==='geral'||monthOf(d)===ui.per);}
function geral(){return ui.per==='geral';}
function perNome(){return geral()?'todo o período':mesNome(ui.per);}
function perCurto(){return geral()?'no geral':'em '+mesCurto(ui.per);}
function capMes(m){var t=mesNome(m);return t.charAt(0).toUpperCase()+t.slice(1);}
function mesCurto(m){return MESES[+m.slice(5,7)-1].slice(0,3);}

function svgBars(meses,series,o){

    return '<g class="col">'+parts+lbl+'<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" style="text-transform:capitalize'+(o.sel===i?';font-weight:700;fill:var(--ink)':'')+'">'+mesCurto(m)+'</text>'+

function tiposDoPedido(p){var ids=[];itensDe(p).forEach(function(i){if(i.t&&ids.indexOf(i.t)<0)ids.push(i.t);});(p.extras||[]).forEach(function(x){if(x.t&&ids.indexOf(x.t)<0)ids.push(x.t);});if(!ids.length&&p.tipoId)ids.push(p.tipoId);

function pct(n,d){return d?Math.round(n/d*100):0;}
function analisar(){var t=today(),ps=alive(S.pedidos).filter(function(p){return p.recebido;}),A=ps.filter(function(p){return janela(p,0,90);}),B=ps.filter(function(p){return janela(p,90,180);}),sig=[];
  function add(o){sig.push(o);}

  function tardio(L){var com=L.filter(function(p){return p.prazo&&entregaDe(p);});return {n:com.length,late:com.filter(function(p){return entregaDe(p)>p.prazo;}).length};}
  var la=tardio(A),lb=tardio(B),pa=pct(la.late,la.n),pb=pct(lb.late,lb.n);
  if(la.n>=4&&pa>=20&&pa>=pb+10)add({n:pa>=40?3:2,cat:'atraso',tit:'Você está atrasando mais entregas',txt:pa+'% dos pedidos dos últimos 90 dias foram entregues depois do prazo'+(lb.n?' (antes: '+pb+'%)':'')+'. Atraso costuma ser o primeiro motivo de cliente procurar outro cadista.'});
  function lead(L){var v=L.filter(entregaDe).map(function(p){return Math.max(0,daysBetween(p.recebido,entregaDe(p)));});return v.length?{m:v.reduce(function(a,b){return a+b;},0)/v.length,n:v.length}:null;}
  var ta=lead(A),tb=lead(B);
  if(ta&&tb&&ta.n>=4&&tb.n>=4&&ta.m>=tb.m*1.3&&ta.m-tb.m>=1)add({n:2,cat:'atraso',tit:'Suas entregas estão mais lentas',txt:'Você leva em média '+ta.m.toFixed(1).replace('.',',')+' dias do recebimento até enviar para aprovação (antes: '+tb.m.toFixed(1).replace('.',',')+' dias).'});
  /* --- 2. Clientes --- */
  var porCli={};ps.forEach(function(p){if(p.clienteId)(porCli[p.clienteId]=porCli[p.clienteId]||[]).push(p);});
  var linhasCli=[];
  Object.keys(porCli).forEach(function(cid){var c=cliente(cid);if(!c)return;var L=porCli[cid].sort(function(a,b){return a.recebido<b.recebido?-1:1;}),a=L.filter(function(p){return janela(p,0,90);}),b=L.filter(function(p){return janela(p,90,180);});
    var ds=L.map(function(p){return p.recebido;}),gaps=[];for(var i=Math.max(1,ds.length-6);i<ds.length;i++)gaps.push(daysBetween(ds[i-1],ds[i]));
    var iv=gaps.length?gaps.reduce(function(x,y){return x+y;},0)/gaps.length:null,dias=daysBetween(ds[ds.length-1],t);
    var parou=[];var ta2={},tb2={};a.forEach(function(p){tiposDoPedido(p).forEach(function(n){ta2[n]=(ta2[n]||0)+1;});});b.forEach(function(p){tiposDoPedido(p).forEach(function(n){tb2[n]=(tb2[n]||0)+1;});});
    var aj=function(L2,n){var x=L2.filter(function(p){return tiposDoPedido(p).indexOf(n)>=0;});return x.length?x.reduce(function(s,p){return s+(p.ajustes||0);},0)/x.length:0;};
    var lin={c:c,a:a.length,b:b.length,iv:iv,dias:dias,parou:[],ult:ds[ds.length-1],aj:L.length?L.reduce(function(s,p){return s+(p.ajustes||0);},0)/L.length:0};
    if(L.length>=3&&iv&&dias>Math.max(2*iv,14)&&dias<=240)add({n:dias>3*iv?3:2,cat:'frequencia',cid:cid,tit:c.nome+' parou de enviar com frequência',txt:'Sem pedidos há '+dias+' dias. Costumava mandar a cada '+Math.round(iv)+' dias.',msg:'sumiu'});
    else if(b.length>=5&&a.length<=b.length*0.7&&b.length-a.length>=3)add({n:a.length<=b.length/2?2:1,cat:'frequencia',cid:cid,tit:c.nome+' está enviando menos',txt:a.length+' pedido(s) nos últimos 90 dias, contra '+b.length+' nos 90 anteriores.',msg:'menos'});
    if(a.length>=4&&a.length>=b.length*1.5&&b.length>=1)add({n:0,cat:'positivo',cid:cid,tit:c.nome+' está mandando mais',txt:a.length+' pedidos nos últimos 90 dias (antes: '+b.length+'). Bom momento para agradecer.'});
    if(a.length>=1)Object.keys(tb2).forEach(function(n){if(tb2[n]>=2&&!ta2[n]){lin.parou.push(n);var ajB=aj(b,n),media=lin.aj;
      add({n:ajB>=1.5?3:2,cat:'mudanca',cid:cid,tipo:n,tit:c.nome+' não envia mais '+n,txt:'Mandou '+tb2[n]+' de '+n+' nos 90 dias anteriores e nenhum nos últimos 90, mas continua mandando outros trabalhos.'+(ajB>=1.2?' Os seus pedidos de '+n+' para esse cliente tiveram em média '+ajB.toFixed(1).replace('.',',')+' ajustes: pode ser sinal de insatisfação.':''),msg:'tipo'});}});
    var el=function(L2){return L2.length?L2.reduce(function(s,p){return s+Math.max(1,(p.elementos||[]).length);},0)/L2.length:0;},ea=el(a),eb=el(b);
    if(a.length>=4&&b.length>=4&&ea<=eb*0.6)add({n:1,cat:'mudanca',cid:cid,tit:c.nome+' está mandando casos menores',txt:'Média de '+ea.toFixed(1).replace('.',',')+' elementos por pedido nos últimos 90 dias (antes: '+eb.toFixed(1).replace('.',',')+'). Os casos grandes podem estar indo para outro lugar.',msg:'menos'});
    var dev=L.filter(function(p){return p.entregue&&!p.pago&&daysBetween(p.entregue,t)>30;});
    if(dev.length)add({n:1,cat:'financeiro',cid:cid,tit:c.nome+' tem '+dev.length+' pedido(s) sem pagar há mais de 30 dias',txt:'Total de '+brl(soma(dev))+'. Atraso de pagamento às vezes vem junto com insatisfação.',acao:'cobrar'});
    linhasCli.push(lin);});
  /* --- 3. Qualidade por tipo --- */
  var R=ps.filter(function(p){return janela(p,0,180);}),porTipo={};
  R.forEach(function(p){tiposDoPedido(p).forEach(function(n){var o=porTipo[n]=porTipo[n]||{n:n,ped:0,aj:0,mot:{},a:0,b:0,late:0,com:0,lead:0,leadN:0};o.ped++;o.aj+=p.ajustes||0;(p.ajMotivos||[]).forEach(function(m){o.mot[m]=(o.mot[m]||0)+1;});
    if(janela(p,0,90))o.a++;else o.b++;if(p.prazo&&entregaDe(p)){o.com++;if(entregaDe(p)>p.prazo)o.late++;}if(entregaDe(p)){o.lead+=Math.max(0,daysBetween(p.recebido,entregaDe(p)));o.leadN++;}});});
  var tipos=Object.keys(porTipo).map(function(k){return porTipo[k];}),ajGeral=R.length?R.reduce(function(s,p){return s+(p.ajustes||0);},0)/R.length:0;
  tipos.forEach(function(o){o.ajm=o.ped?o.aj/o.ped:0;var ms=Object.keys(o.mot).sort(function(x,y){return o.mot[y]-o.mot[x];}),tot=ms.reduce(function(s,m){return s+o.mot[m];},0);o.motTop=ms[0]&&ms[0]!=='Não informado'?ms[0]+' ('+pct(o.mot[ms[0]],tot)+'%)':'';
    if(o.ped>=3&&o.ajm>=1.2&&o.ajm>=ajGeral*1.6)add({n:o.ajm>=2?3:2,cat:'qualidade',tit:'Pedidos de '+o.n+' voltam mais para ajuste',txt:'Média de '+o.ajm.toFixed(1).replace('.',',')+' ajustes por pedido nos últimos 6 meses (seus trabalhos em geral: '+ajGeral.toFixed(1).replace('.',',')+').'+' Vale perguntar aos clientes o que costuma voltar.'});});
  tipos.sort(function(x,y){return y.ped-x.ped;});linhasCli.sort(function(x,y){return (y.a+y.b)-(x.a+x.b);});
  sig.sort(function(x,y){return y.n-x.n;});

/* ---------- Arquivos STL: controle de espaço ---------- */
function rArmaz(){
  var t=today(),u=usado(),lim=S.assinatura.limite,pct=Math.min(100,u/lim*100),w=canWrite();
  var vivos=alive(S.arquivos).filter(function(a){return !a.removido;});
  var ups=vivos.filter(function(a){return a.origem==='upload';}),links=vivos.filter(function(a){return a.origem==='link';});
  var econ=ups.reduce(function(s,a){return s+((a.tamOrig||0)-(a.tamZip||0));},0);
  var exp30=ups.filter(function(a){var e=expira(a);return e&&daysBetween(t,e)<=30;});
  var porCli={};ups.forEach(function(a){var p=byId(S.pedidos,a.pedidoId),k=p?p.clienteId:'?';porCli[k]=(porCli[k]||0)+(a.tamZip||0);});
  var sit=[['Em produção (ainda não enviado)',0],['Enviado há até 30 dias',0],['Enviado há 31 a 60 dias (vai expirar)',0]];
  ups.forEach(function(a){var p=byId(S.pedidos,a.pedidoId);if(!p||!p.entregue)sit[0][1]+=a.tamZip||0;else if(daysBetween(p.entregue,t)<=30)sit[1][1]+=a.tamZip||0;else sit[2][1]+=a.tamZip||0;});
  var ord=ui.arqOrd||'maiores',sel=ui.arqSel||(ui.arqSel={});
  var lista=ups.slice().sort({
    maiores:function(a,b){return (b.tamZip||0)-(a.tamZip||0);},
    expira:function(a,b){return (expira(a)||'9')<(expira(b)||'9')?-1:1;},
    recentes:function(a,b){return (b.criado||'')<(a.criado||'')?-1:1;},
    antigos:function(a,b){return (a.criado||'')<(b.criado||'')?-1:1;}}[ord]);
  var selIds=Object.keys(sel).filter(function(id){var a=byId(S.arquivos,id);return a&&!a.deleted&&!a.removido;});
  var selTam=selIds.reduce(function(s,id){return s+(byId(S.arquivos,id).tamZip||0);},0);
  var removidos=alive(S.arquivos).filter(function(a){return a.removido;});
  return (emGratis()?avisoGratis():'')+'<div class="dash">'+
      '<div class="kpi" style="cursor:default"><span class="lbl">Espaço usado</span><span class="v">'+bytes(u)+'</span><div class="bar '+(pct>90?'full':pct>75?'warn':'')+'" style="height:8px"><i style="width:'+pct.toFixed(1)+'%"></i></div><span class="foot"><span>'+pct.toFixed(1).replace('.',',')+'% de '+bytes(lim)+' · livre '+bytes(Math.max(0,lim-u))+'</span></span></div>'+
      kpi('Arquivos',ups.length,'<span>'+links.length+' link(s) externo(s), que não ocupam espaço</span>')+
      kpi('Economia com zip',bytes(econ),'<span>'+(ups.length?Math.round(econ/ups.reduce(function(s,a){return s+(a.tamOrig||0);},0)*100):0)+'% menor que os STL originais</span>')+
      kpi('Expiram em 30 dias',bytes(exp30.reduce(function(s,a){return s+(a.tamZip||0);},0)),'<span>'+exp30.length+' arquivo(s) serão apagados sozinhos</span>')+
      '<section class="card stack half"><div><h2>Espaço por cliente</h2><p class="small muted">Quem ocupa mais memória</p></div>'+
        hbars(Object.keys(porCli).sort(function(a,b){return porCli[b]-porCli[a];}).slice(0,6).map(function(k){var c=cliente(k);return {l:esc(c?c.nome:'(sem cliente)'),r:bytes(porCli[k]),v:porCli[k]};}),'Nenhum arquivo enviado.')+'</section>'+
      '<section class="card stack half"><div><h2>Espaço por situação</h2><p class="small muted">Arquivos são apagados 60 dias após o envio ao cliente</p></div>'+
        hbars(sit.map(function(s,i){return {l:s[0],r:bytes(s[1]),v:s[1],cor:i===2?'var(--warn)':''};}))+'</section>'+

      '<button class="btn danger" data-a="delSel" '+(selIds.length&&w?'':'disabled')+'>Excluir selecionados'+(selIds.length?' ('+selIds.length+' · '+bytes(selTam)+')':'')+'</button></div>'+
      dd('arqOrd')+
      (lista.length?'<div class="list">'+lista.map(function(a){

        return '<div class="li" style="cursor:default"><label class="row" style="min-width:0;flex:1;cursor:pointer"><input type="checkbox" class="arqck" data-id="'+a.id+'" '+(sel[a.id]?'checked':'')+' '+(w?'':'disabled')+' style="width:20px;height:20px;accent-color:var(--accent);flex:none">'+

          '<span class="row" style="gap:6px">'+(e?'<span class="tag '+(d<=7?'u':d<=30?'w':'')+'">'+(d<=0?'expira hoje':'expira em '+d+'d')+'</span>':'<span class="tag a">em produção</span>')+'<button class="btn sm" data-a="verPedido" data-id="'+a.pedidoId+'">Pedido</button></span></div>';}).join('')+'</div>':'<p class="empty">Nenhum arquivo enviado.</p>')+

}

/* Pix */
function pixKey(){
  var p=S.perfil,k=(p.chave||'').trim();
  if(p.tipoChave==='cpf'||p.tipoChave==='cnpj')return k.replace(/\D/g,'');
  if(p.tipoChave==='telefone'){var d=k.replace(/\D/g,'');if(d.length===10||d.length===11)d='55'+d;return '+'+d;}
  if(p.tipoChave==='email')return k.toLowerCase();
  return k;
}
function norm(s,n){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().trim().slice(0,n);}
function emv(id,v){return id+pad(v.length)+v;}
function crc16(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF;}}return c.toString(16).toUpperCase().padStart(4,'0');}
function brcode(valor,txid){
  var p=emv('00','01')+emv('26',emv('00','br.gov.bcb.pix')+emv('01',pixKey()))+emv('52','0000')+emv('53','986')+

var viewer=null;

/* Envio de arquivos: compacta em zip no navegador e manda direto para o armazenamento (Cloudflare R2).
   O servidor (função "arquivos") confere dono, assinatura e espaço e devolve um link que vale por pouco tempo. */
async function fnArq(acao,body){
  var r=await sb.functions.invoke('arquivos',{body:Object.assign({acao:acao},body)});
  if(r.error){var m='';try{m=(await r.error.context.json()).erro;}catch(x){}throw new Error(m||'sem conexão com o servidor');}
  if(r.data&&r.data.erro)throw new Error(r.data.erro);return r.data;
}
function upProg(pid,txt,pct){ui.up=txt==null?null:{pid:pid,txt:txt,pct:pct||0};var st=document.getElementById('up-st');if(!st)return;
  if(!ui.up){st.hidden=true;return;}st.hidden=false;var tx=document.getElementById('up-txt'),br=document.getElementById('up-bar');if(tx)tx.textContent=txt;if(br)br.style.width=(pct||0).toFixed(0)+'%';}
function putComProgresso(url,blob,onp){return new Promise(function(ok,ko){var x=new XMLHttpRequest();x.open('PUT',url);x.setRequestHeader('Content-Type','application/zip');
  x.upload.onprogress=function(e){if(e.lengthComputable)onp(e.loaded/e.total);};x.onload=function(){x.status>=200&&x.status<300?ok():ko(new Error('o armazenamento recusou o envio ('+x.status+')'));};
  x.onerror=function(){ko(new Error('sem conexão com o armazenamento'));};x.send(blob);});}
async function enviaArquivo(pid,files,cat){
  if(!guardArq())return;files=[].slice.call(files||[]).filter(Boolean);var fi=document.getElementById('up-file');if(fi)fi.value='';if(!files.length)return;
  if(ui.up){toast('Espere o envio atual terminar.');return;}
  if(files.some(function(f){return !/\.(stl|ply|obj|zip|html?|png|jpe?g|webp)$/i.test(f.name);})){toast('Envie STL, PLY, OBJ, ZIP, HTML ou imagens (PNG, JPG).');return;}
  var tot=files.reduce(function(s,f){return s+f.size;},0);if(tot>2*GB){toast('Os arquivos passam de 2 GB. Use um link externo.');return;}
  var p=byId(S.pedidos,pid),umZip=files.length===1&&/\.zip$/i.test(files[0].name);
  var nome=umZip?files[0].name:files.length===1?files[0].name.replace(/\.[^.]+$/,'')+'.zip':('Escaneamento '+(p?p.paciente+' #'+p.num:'')).trim()+'.zip';
  try{
    var blob;
    if(umZip)blob=files[0];
    else{if(!window.JSZip)throw new Error('o compactador não carregou');upProg(pid,'Compactando '+files.length+' arquivo(s) de '+bytes(tot)+'…',0);
      var z=new JSZip();files.forEach(function(f){z.file(f.name,f);});
      blob=await z.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}},function(m){upProg(pid,'Compactando… '+m.percent.toFixed(0)+'%',m.percent);});}
    var livre=S.assinatura.limite-usado();if(blob.size>livre)throw new Error('sem espaço: faltam '+bytes(blob.size-livre)+'. Apague arquivos ou use um link');
    upProg(pid,'Preparando o envio…',0);
    clearTimeout(syncTimer);syncFila=syncFila.then(sincroniza);await syncFila; // o pedido precisa estar salvo antes
    var pr=await fnArq('preparar',{pedido_id:pid,tamanho:blob.size});
    await putComProgresso(pr.url,blob,function(f){upProg(pid,'Enviando '+bytes(blob.size)+'… '+Math.round(f*100)+'%',f*100);});
    upProg(pid,'Conferindo…',100);
    var r=await fnArq('confirmar',{pedido_id:pid,key:pr.key,nome:nome,tamanho_original:tot,categoria:cat||null});
    var a=MAP.arquivos.from(r);if(cat&&!a.cat)a.cat=cat;S.arquivos.push(a);SNAP.arquivos=SNAP.arquivos||{};SNAP.arquivos[a.id]=JSON.stringify(MAP.arquivos.to(a));blobs.set(a.id,blob);
    upProg(pid,null);toast(umZip?'Zip enviado: '+bytes(blob.size)+'.':'Enviado: '+bytes(tot)+' → '+bytes(blob.size)+' ('+Math.max(0,Math.round((1-blob.size/tot)*100))+'% menor).');
  }catch(e){upProg(pid,null);toast('Não deu para enviar: '+e.message+'.');}
  if(ui.sheet)renderSheet();render();
}
