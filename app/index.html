<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ideali CAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: app de celular com menu inferior; no computador o menu vira barra lateral. Mesmos tokens da página de apresentação. */
:root{
  --bg:#F6F5F8; --surface:#FFFFFF; --ink:#1B1830; --muted:#625E75; --line:#E2DFEA;
  --accent:#5B45E0; --accent-ink:#FFFFFF; --accent-soft:#EEEBFD;
  /* pigmentos: usados em pouca quantidade */
  --p1:#EF5F5A; --p2:#F0A53A; --p3:#1DAE8A; --p4:#3A96EC; --p5:#7B5CF2; --p6:#DD5A9E;
  --paint:linear-gradient(90deg,var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p6));
  --urgent:#D2433A; --ok:#1E8A5A; --warn:#B7791F; --soft:#EEF1F3;
  --c1:var(--p4); --c2:var(--p2); --c2t:#9A5A00; --c3:var(--p5); --c4:var(--p3);
  --f-display:"Plus Jakarta Sans",system-ui,"Segoe UI",Arial,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121019; --surface:#1B1826; --ink:#ECEAF4; --muted:#A39FB6; --line:#2D2940; --accent:#9E8CFF; --accent-ink:#121019; --accent-soft:#2A2450; --urgent:#FF6E63; --ok:#4CC58A; --warn:#E8B04A; --soft:#221F31; --p1:#FF7B74; --p2:#F7BC5C; --p3:#3CCFA6; --p4:#62B0FF; --p5:#9E86FF; --p6:#F27AB8; --c1:var(--p4); --c2:var(--p2); --c2t:#F7BC5C; --c3:var(--p5); --c4:var(--p3); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121019; --surface:#1B1826; --ink:#ECEAF4; --muted:#A39FB6; --line:#2D2940; --accent:#9E8CFF; --accent-ink:#121019; --accent-soft:#2A2450; --urgent:#FF6E63; --ok:#4CC58A; --warn:#E8B04A; --soft:#221F31; --p1:#FF7B74; --p2:#F7BC5C; --p3:#3CCFA6; --p4:#62B0FF; --p5:#9E86FF; --p6:#F27AB8; --c1:var(--p4); --c2:var(--p2); --c2t:#F7BC5C; --c3:var(--p5); --c4:var(--p3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(38rem 28rem at -5% -5%,color-mix(in srgb,var(--p6) 10%,transparent),transparent 70%),radial-gradient(34rem 26rem at 105% 8%,color-mix(in srgb,var(--p4) 10%,transparent),transparent 70%),radial-gradient(40rem 30rem at 85% 105%,color-mix(in srgb,var(--p2) 9%,transparent),transparent 70%),radial-gradient(32rem 26rem at 5% 100%,color-mix(in srgb,var(--p3) 8%,transparent),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:1.45rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body.sem-anim *{transition:none!important;animation:none!important}

/* Shell: barra lateral fixa no computador, gaveta + barra inferior no celular */
.shell{min-height:100%}
.side{position:fixed;top:0;bottom:0;left:0;width:252px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));z-index:40;transform:translateX(-102%);transition:transform .22s ease;overflow-y:auto}
.shell.open .side{transform:none;box-shadow:0 0 40px #0004}
.scrim{display:none}
.shell.open .scrim{display:block;position:fixed;inset:0;background:color-mix(in srgb,#000 40%,transparent);z-index:35}
.content{min-width:0;min-height:100%}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.side .brand{padding:4px 10px 14px}
.side .grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:14px 12px 6px;font-weight:600}
.side .it{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500;text-align:left}
.side .it svg{width:20px;height:20px;flex:none}
.side .it:hover{color:var(--ink);background:var(--soft)}
.side .it.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .badge{margin-left:auto;font:600 .7rem var(--f-mono);background:var(--urgent);color:#fff;border-radius:99px;padding:1px 7px}
.side .plan{margin-top:auto;background:var(--soft);border-radius:14px;padding:14px;display:grid;gap:8px;font-size:.85rem}
.side .me{display:flex;align-items:center;gap:10px;padding:12px 6px 0;font-size:.85rem;min-width:0}
.side .me .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:none;margin-inline:auto}
.top h1{flex:1;min-width:0;font-size:1.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .search{max-width:300px;padding:.55em .9em}
.top .dk{display:none}
.top .spacer{flex:1}
.top .search{max-width:320px}
.tnav{display:none;border-top:1px solid var(--line)}
.tnav-in{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;max-width:none;margin-inline:auto;padding:8px 22px}
.tnav-in::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.tnav button{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:10px;border:0;background:none;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer}
.tnav button svg{width:18px;height:18px}
.tnav button:hover{color:var(--ink);background:var(--soft)}
.tnav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tnav .badge{font:600 .68rem var(--f-mono);background:var(--urgent);color:#fff;border-radius:99px;padding:1px 6px}
.main{padding:16px 16px 110px;max-width:none;margin-inline:auto;width:100%;display:grid;gap:16px;align-content:start}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 2px;font-size:.7rem;color:var(--muted);cursor:pointer;border-radius:10px}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:var(--accent);font-weight:600}
.bnav .plus{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.7rem;margin:-18px auto 0;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.bnav button:disabled{opacity:.45}
@media (min-width:960px){
  .content{margin-left:0}
  .bnav,.menu-btn,.scrim,.top .mb{display:none!important}
  .top .dk{display:inline-flex}
  .main{padding:24px 28px 48px}
  .top-in{padding:12px 28px}
  .tnav{display:block}
}

/* Dashboard */
.cfg{max-width:1180px;margin-inline:auto;display:grid;gap:16px}
.cfg-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);scrollbar-width:none}
.cfg-tabs::-webkit-scrollbar{display:none}
.cfg-tabs button{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;white-space:nowrap;cursor:pointer}
.cfg-tabs button svg{width:17px;height:17px}
.cfg-tabs button:hover{color:var(--ink);background:var(--soft)}
.cfg-tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cfg-tabs .n{font:600 .68rem var(--f-mono);background:var(--muted);color:#fff;border-radius:99px;padding:1px 6px}
.cfg-grid{display:grid;gap:16px;align-items:start}
.cfg-grid .g2{display:grid;gap:12px}
.cfg-grid .cfg-perfil .row .btn{min-width:200px}
@media (min-width:960px){
  .cfg-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
  .cfg-grid .g2{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
  .cfg-grid .g2 .ac{grid-column:1/-1}
}
@media (max-width:959px){.cfg-grid .cfg-perfil .row .btn{width:100%}}
@media (max-width:699px){.cfg-tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px}.cfg-tabs button{flex-direction:column;gap:3px;padding:8px 2px;font-size:.72rem;position:relative;justify-content:center}.cfg-tabs button svg{width:19px;height:19px}.cfg-tabs .n{position:absolute;top:3px;right:calc(50% - 22px)}}
.dash{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.dash>*{grid-column:span 12;min-width:0}
@media (min-width:700px){.dash .kpi{grid-column:span 6}.dash .half{grid-column:span 6}}
@media (min-width:1100px){.dash .kpi{grid-column:span 3}.dash .wide{grid-column:span 8}.dash .narrow{grid-column:span 4}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:6px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.kpi .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .foot{display:flex;justify-content:space-between;align-items:end;gap:8px;font-size:.82rem;color:var(--muted)}
.kpi svg.spark{width:96px;height:30px;flex:none}
.spark path.l{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark path.a{fill:var(--accent);opacity:.12}
.spark circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.delta{font:600 .75rem var(--f-mono);padding:.2em .5em;border-radius:6px}
.delta.up{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.delta.down{background:color-mix(in srgb,var(--urgent) 13%,transparent);color:var(--urgent)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font:500 11px var(--f-body)}
.chart text.val{fill:var(--ink);font:600 12px var(--f-mono)}
.chart .pago{fill:var(--accent)}
.chart .aberto{fill:color-mix(in srgb,var(--accent) 32%,var(--surface))}
.chart .hit{fill:transparent;cursor:pointer}
.chart .dim{opacity:.45}
.lg-ab{background:color-mix(in srgb,var(--accent) 32%,var(--surface))}
.per{padding-bottom:4px}
.kpi .bar{margin-top:2px}
.chart .col:hover .pago,.chart .col:hover .aberto{filter:brightness(1.08)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:.8rem;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);z-index:3}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0;border:0;background:none;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.hbar .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hbar b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Peças */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:700px){.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:4px;min-width:0;text-align:left;cursor:pointer}
.stat .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.alert .v{color:var(--urgent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:.65em 1.1em;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--urgent);border-color:color-mix(in srgb,var(--urgent) 40%,transparent)}
.btn.sm{padding:.4em .8em;font-size:.85rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.icon-btn svg{width:18px;height:18px}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.fab-old{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent) 70%,transparent);font-size:1.8rem;cursor:pointer}
@media (min-width:900px){.fab{bottom:28px}}
.tag{font-family:var(--f-mono);font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:.3em .6em;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.u{background:color-mix(in srgb,var(--urgent) 14%,transparent);color:var(--urgent)}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.list{display:grid}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;cursor:pointer}
.li:first-child{border-top:0}
.li .t{min-width:0}
.li .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{font-size:.85rem;color:var(--muted)}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
.bar{height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.warn i{background:var(--warn)}.bar.full i{background:var(--urgent)}
.banner{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink)}
.banner.bad{background:color-mix(in srgb,var(--urgent) 14%,var(--surface))}
.seg{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-bottom:2px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.4em .9em;font-size:.88rem;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;padding:.7em 1em;border-radius:12px;border:1px solid var(--line);background:var(--surface)}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,84%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin-inline:-16px;padding-inline:16px}
@media (min-width:900px){.kanban{grid-auto-columns:minmax(0,1fr);margin-inline:0;padding-inline:0}}
.kcol{scroll-snap-align:start;background:var(--soft);border-radius:16px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.kcol-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kcol-h b{color:var(--ink)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;cursor:pointer;text-align:left;min-width:0}
.kcard.u{box-shadow:inset 3px 0 0 var(--urgent)}
.kcard .r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kcard .who{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard .mv{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:2px}
.late{color:var(--urgent);font-weight:600}

/* Colunas de produção */
.kcol{padding:0;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.kcol-h{padding:12px 14px;color:var(--ink);background:color-mix(in srgb,var(--colc) 16%,var(--surface));border-top:4px solid var(--colc);text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:.9rem}
.kcol-h b{color:inherit;display:block;font-size:.95rem}
.kcol-h small{opacity:.85;font-size:.75rem}
.kcol-h .cnt{background:color-mix(in srgb,var(--colc) 30%,var(--surface));border-radius:99px;min-width:28px;height:28px;display:grid;place-items:center;font:700 .8rem var(--f-mono);padding:0 8px}
.st-entrada{--colc:var(--c1)}.st-pendente{--colc:var(--c2)}.st-aprovacao{--colc:var(--c3)}.st-finalizado{--colc:var(--c4)}
.kcol-b{display:grid;gap:8px;padding:10px;align-content:start;min-height:120px}
.kcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.kcard.drag{opacity:.4}
.kcard .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.kcard .acts .btn,.ask .btn{padding:.35em .75em;font-size:.8rem}
.pend{display:flex;flex-wrap:wrap;gap:4px;background:color-mix(in srgb,var(--c2) 12%,var(--surface));border-radius:10px;padding:8px}
.pend span{font-size:.75rem;font-weight:600;color:var(--c2t);background:var(--surface);border:1px solid color-mix(in srgb,var(--c2) 40%,transparent);border-radius:99px;padding:.15em .6em}
.pend em{font-style:normal;font-size:.8rem;width:100%;color:var(--ink)}
.pend small{width:100%;color:var(--muted);font-size:.72rem}
.ask{display:grid;gap:8px;background:color-mix(in srgb,var(--c4) 12%,var(--surface));border-radius:10px;padding:10px;font-size:.85rem}
.ask .row{justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipck{cursor:pointer}

async function sincroniza(){
  if(!sb||!S.sessao)return;
  try{
    var pr=JSON.stringify(perfilRow());
    if(pr!==SNAP.perfil){var r0=await sb.from('perfis').update(JSON.parse(pr)).eq('user_id',S.sessao.id);if(r0.error)throw r0.error;SNAP.perfil=pr;}
    for(var i=0;i<ORDEM.length;i++){
      var k=ORDEM[i],m=MAP[k],antes=SNAP[k]||{},agora={};
      S[k].forEach(function(x){if(!x.id)x.id=uid();});
      for(var j=0;j<S[k].length;j++){
        var x=S[k][j],js=JSON.stringify(m.to(x));agora[x.id]=js;
        if(antes[x.id]===js)continue;
        var row=JSON.parse(js),res;
        if(antes[x.id]===undefined){row.id=x.id;res=await sb.from(m.t).insert(row);}
        else res=await sb.from(m.t).update(row).eq('id',x.id);
        if(res.error)throw res.error;
        antes[x.id]=js;
      }
      // itens removidos da lista (ex.: preço apagado) vão para a lixeira no banco
      for(var id in antes){if(!(id in agora)){var rd=await sb.from(m.t).update({deleted_at:new Date().toISOString()}).eq('id',id);if(rd.error)throw rd.error;delete antes[id];}}
      SNAP[k]=antes;
    }
    marcaSync('salvo');
  }catch(e){
    console.error(e);marcaSync('erro');
    toast(traduzErro(e)+' Recarregando seus dados…');
    setTimeout(carregar,1200);
  }
}
function traduzErro(e){var m=(e&&(e.message||e.error_description))||String(e);
  if(/row-level security|violates row-level|permission denied/i.test(m))return canWrite()?'Sem permissão para essa alteração.':'Assinatura vencida: não foi possível salvar.';
  if(/Failed to fetch|NetworkError|network/i.test(m))return 'Sem conexão com a internet.';
  if(/duplicate key/i.test(m))return 'Esse registro já existe.';
  return 'Não foi possível salvar ('+m+').';}

/* ---------- Período (meses e geral) ---------- */
function ultimosMeses(n){return mesesAte(monthOf(today()),n);}
function mesesAte(end,n){var m=end,out=[];for(var i=0;i<n;i++){out.unshift(m);m=prevMonth(m);}return out;}
function inPer(d){return !!d&&(ui.per==='geral'||monthOf(d)===ui.per);}
function geral(){return ui.per==='geral';}
function perNome(){return geral()?'todo o período':mesNome(ui.per);}
function perCurto(){return geral()?'no geral':'em '+mesCurto(ui.per);}
function capMes(m){var t=mesNome(m);return t.charAt(0).toUpperCase()+t.slice(1);}
function mesCurto(m){return MESES[+m.slice(5,7)-1].slice(0,3);}
function perPicker(){return '<div class="row wrap">'+dd('per')+'</div>';}
var DD={
  per:{label:'Período',get:function(){return ui.per;},set:function(v){ui.per=v;},rev:true,
    opts:function(){return ultimosMeses(24).map(function(m){return [m,capMes(m)];}).concat([['geral','Geral (todo o período)']]);}},
  cliOrd:{label:'Ordenar',get:function(){return ui.cliOrd||'az';},set:function(v){ui.cliOrd=v;},
    opts:function(){var n=alive(S.clientes).filter(function(c){var s=statsCli(c.id);return s.dias===null||s.dias>INATIVO_DIAS;}).length;return [['az','A a Z'],['recentes','Últimos adicionados'],['antigos','Mais antigos'],['mais','Que mais pedem'],['menos','Que menos pedem'],['inativos','Inativos ('+n+')']];}},
  cliTipo:{label:'Tipo',get:function(){return ui.cliTipo||'todos';},set:function(v){ui.cliTipo=v;},opts:function(){return [['todos','Todos'],['laboratorio','Laboratórios'],['dentista','Dentistas']];}},
  admFiltro:{label:'Mostrar',get:function(){return ui.admFiltro||'todos';},set:function(v){ui.admFiltro=v;},opts:function(){return [['todos','Todos'],['teste','Em teste'],['ativa','Ativos'],['vencida','Vencidos / teste acabou']];}},
  arqOrd:{label:'Ordenar',get:function(){return ui.arqOrd||'maiores';},set:function(v){ui.arqOrd=v;},opts:function(){return [['maiores','Maiores primeiro'],['expira','Expiram antes'],['recentes','Mais recentes'],['antigos','Mais antigos']];}},
  tipoMet:{label:'Medir por',get:function(){return ui.tipoMet||'n';},set:function(v){ui.tipoMet=v;},opts:function(){return [['n','Pedidos'],['el','Elementos'],['v','Faturamento']];}},
  vista:{label:'Mostrar',get:function(){return ui.vista==='arq'?'arq':'kanban';},set:function(v){ui.vista=v;},
    opts:function(){return [['kanban','Produção (kanban)'],['arq','Arquivados ('+alive(S.pedidos).filter(function(p){return p.status==='arquivado';}).length+')']];}},
  filtro:{label:'Pedidos',get:function(){return ui.filtro==='urg'?'urg':'todos';},set:function(v){ui.filtro=v;},
    opts:function(){return [['todos','Todos'],['urg','Só urgentes ('+alive(S.pedidos).filter(function(p){return p.urgente&&aberto(p);}).length+')']];}}
};
function dd(k){

function pedPer(){return alive(S.pedidos).filter(function(p){return inPer(p.recebido);});}
function fatMes(m){return soma(alive(S.pedidos).filter(function(p){return monthOf(p.recebido)===m;}));}
function pagoMes(m){return soma(alive(S.pedidos).filter(function(p){return monthOf(p.recebido)===m&&p.pago;}));}
function elems(ps){return ps.reduce(function(s,p){return s+(p.elementos.length||1);},0);}

/* ---------- Peças de gráfico ---------- */
function spark(vals){
  var w=96,h=30,max=Math.max.apply(null,vals)||1,n=vals.length;
  var pts=vals.map(function(v,i){return [(i/(n-1))*(w-6)+3,h-4-(v/max)*(h-8)];});
  var d='M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join('L');
  var last=pts[n-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><path class="a" d="'+d+'L'+last[0]+' '+h+'L3 '+h+'Z"/><path class="l" d="'+d+'"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="3.5"/></svg>';
}
function delta(a,b){if(geral()||!b)return '';var p=Math.round((a-b)/b*100);return '<span class="delta '+(p>=0?'up':'down')+'">'+(p>=0?'▲ ':'▼ ')+Math.abs(p)+'%</span> <span>vs '+mesCurto(prevMonth(ui.per))+'</span>';}
function kpi(l,v,foot,sp,tab){var tag=tab?'button':'div';return '<'+tag+' class="kpi"'+(tab?' data-a="tab" data-v="'+tab+'"':' style="cursor:default"')+'><span class="lbl">'+l+'</span><span class="v">'+v+'</span><span class="foot"><span class="row" style="gap:6px;flex-wrap:wrap">'+(foot||'')+'</span>'+(sp||'')+'</span></'+tag+'>';}
function nice(v){if(v<=0)return 1;var e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;}
function brlCurto(v){return v>=1000?'R$ '+(v/1000).toFixed(v>=10000?0:1).replace('.',',')+' mil':'R$ '+Math.round(v);}
function svgBars(meses,series,o){
  // series: [{v:[...],cls:'pago'}, ...] empilhadas de baixo para cima; o.fmt, o.sel (índice com rótulo), o.tip(i)
  var nar=window.innerWidth<700,W=nar?360:Math.round(Math.min(1300,Math.max(600,window.innerWidth*0.6))),H=nar?220:230,L=nar?52:58,B=26,T=22,R=8;
  var tot=meses.map(function(_,i){return series.reduce(function(s,x){return s+x.v[i];},0);});
  var max=nice(Math.max.apply(null,tot.concat([0])));if(o.int){max=Math.max(2,Math.ceil(max));if(max%2)max++;}var cw=(W-L-R)/meses.length,bw=Math.min(40,cw*0.55),fmt=o.fmt||brlCurto;
  function y(v){return T+(H-T-B)*(1-v/max);}
  var g='<g class="grid">'+[0,.5,1].map(function(f){var v=max*f;return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fmt(v)+'</text>';}).join('')+'</g>';
  var cols=meses.map(function(m,i){
    var x=L+cw*i+(cw-bw)/2,base=0,parts='',segs=series.filter(function(s){return s.v[i]>0;});
    segs.forEach(function(s,k){var y0=y(base),y1=y(base+s.v[i]),top=k===segs.length-1,r=top?Math.min(4,bw/2):0,gap=k>0?2:0;
      parts+='<path class="'+s.cls+'" d="M'+x+' '+(y0-gap)+'V'+(y1+r)+(r?'Q'+x+' '+y1+' '+(x+r)+' '+y1+'H'+(x+bw-r)+'Q'+(x+bw)+' '+y1+' '+(x+bw)+' '+(y1+r):'H'+(x+bw))+'V'+(y0-gap)+'Z"/>';base+=s.v[i];});
    var lbl=(o.sel==null?i===meses.length-1:o.sel===i)&&tot[i]>0?'<text class="val" x="'+(x+bw/2)+'" y="'+(y(tot[i])-7)+'" text-anchor="middle">'+fmt(tot[i])+'</text>':'';
    return '<g class="col">'+parts+lbl+'<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" style="text-transform:capitalize'+(o.sel===i?';font-weight:700;fill:var(--ink)':'')+'">'+mesCurto(m)+'</text>'+
      '<rect class="hit" x="'+(L+cw*i)+'" y="'+T+'" width="'+cw+'" height="'+(H-T)+'" data-tip="'+esc(o.tip(i))+'" data-x="'+(x+bw/2)+'" data-y="'+y(tot[i])+'"/></g>';
  }).join('');
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Gráfico por mês')+'">'+g+cols+'</svg><div class="tip" hidden></div></div>';
}
function hbars(rows,empty){
  if(!rows.length)return '<p class="empty">'+(empty||'Sem dados neste período.')+'</p>';
  var max=Math.max.apply(null,rows.map(function(r){return r.v;}))||1;
  return '<div>'+rows.map(function(r){var tag=r.a?'button':'div';return '<'+tag+' class="hbar"'+(r.a?' data-a="'+r.a+'" data-id="'+(r.id||'')+'" data-v="'+(r.dv||'')+'"':' style="cursor:default"')+'><b>'+r.l+'</b><span class="row" style="gap:6px">'+(r.tag||'')+'<span class="mono small">'+r.r+'</span></span><span class="track"><i style="width:'+(r.v/max*100).toFixed(1)+'%;'+(r.cor?'background:'+r.cor:'')+'"></i></span></'+tag+'>';}).join('')+'</div>';
}

  var porCli={};ups.forEach(function(a){var p=byId(S.pedidos,a.pedidoId),k=p?p.clienteId:'?';porCli[k]=(porCli[k]||0)+(a.tamZip||0);});

        hbars(Object.keys(porCli).sort(function(a,b){return porCli[b]-porCli[a];}).slice(0,6).map(function(k){var c=cliente(k);return {l:esc(c?c.nome:'(sem cliente)'),r:bytes(porCli[k]),v:porCli[k]};}),'Nenhum arquivo enviado.')+'</section>'+

        hbars(sit.map(function(s,i){return {l:s[0],r:bytes(s[1]),v:s[1],cor:i===2?'var(--warn)':''};}))+'</section>'+

}

function sitAss(a){var agora=new Date();if(a.status==='ativa'&&(!a.vence_em||new Date(a.vence_em)>agora))return 'ativa';if(a.status==='teste'&&a.teste_ate&&new Date(a.teste_ate)>agora)return 'teste';return 'vencida';}

function rAdmin(){
  if(!S.admin)return '<div class="card empty">Esta área é só para o administrador do sistema.</div>';

  var por={teste:0,ativa:0,vencida:0},receita=0;

  var novos30=L.filter(function(a){return a.cadastro&&new Date(a.cadastro)>new Date(Date.now()-30*864e5);}).length;
  var lista=L.filter(function(a){if(f!=='todos'&&sitAss(a)!==f)return false;if(q&&((a.nome||'')+' '+(a.email||'')+' '+(a.telefone||'')+' '+(a.cidade||'')).toLowerCase().indexOf(q)<0)return false;return true;});
  return '<div class="banner"><span>🛡️ Você está na conta mestre. Aqui aparecem só <b>cadastro e assinatura</b> dos cadistas. Clientes, pedidos e pacientes deles continuam privados.</span><button class="btn sm" data-a="admRecarregar">Atualizar</button></div>'+
    '<div class="dash">'+
      kpi('Assinantes',L.length,'<span>'+novos30+' novo(s) nos últimos 30 dias</span>')+
      kpi('Em teste',por.teste,'<span>14 dias grátis</span>')+
      kpi('Ativos',por.ativa,'<span>'+por.vencida+' vencido(s)</span>')+

/* Pix */
function pixKey(){
  var p=S.perfil,k=(p.chave||'').trim();
  if(p.tipoChave==='cpf'||p.tipoChave==='cnpj')return k.replace(/\D/g,'');
  if(p.tipoChave==='telefone'){var d=k.replace(/\D/g,'');if(d.length===10||d.length===11)d='55'+d;return '+'+d;}
  if(p.tipoChave==='email')return k.toLowerCase();
  return k;
}
function norm(s,n){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().trim().slice(0,n);}
function emv(id,v){return id+pad(v.length)+v;}
function crc16(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF;}}return c.toString(16).toUpperCase().padStart(4,'0');}
function brcode(valor,txid){
  var p=emv('00','01')+emv('26',emv('00','br.gov.bcb.pix')+emv('01',pixKey()))+emv('52','0000')+emv('53','986')+
    (valor>0?emv('54',valor.toFixed(2)):'')+emv('58','BR')+emv('59',norm(S.perfil.recebedor||S.perfil.nome,25)||'RECEBEDOR')+
    emv('60',norm(S.perfil.cidade,15)||'BRASIL')+emv('62',emv('05',txid||'***'))+'6304';
  return p+crc16(p);
}

/* Visualizador 3D */
var viewer=null;
function fViewer(id){var a=byId(S.arquivos,id);return head(esc(a?a.nome:'Arquivo'))+'<div class="viewer3d" id="v3"><canvas id="v3c"></canvas><div class="msg" id="v3m">Abrindo o arquivo…</div></div><p class="small muted">Arraste para girar. Use dois dedos ou a roda do mouse para zoom.</p>';}
function parseSTL(buf){
  var dv=new DataView(buf);
  if(buf.byteLength>84){var n=dv.getUint32(80,true);if(84+n*50===buf.byteLength){var pos=new Float32Array(n*9);for(var i=0;i<n;i++){var o=84+i*50+12;for(var k=0;k<9;k++)pos[i*9+k]=dv.getFloat32(o+k*4,true);}return pos;}}
  var txt=new TextDecoder().decode(buf),re=/vertex\s+([-+\d.eE]+)\s+([-+\d.eE]+)\s+([-+\d.eE]+)/g,m,arr=[];
  while((m=re.exec(txt)))arr.push(+m[1],+m[2],+m[3]);return new Float32Array(arr);
}
function abreViewer(id){
  var a=byId(S.arquivos,id),msg=document.getElementById('v3m');
  var b=blobs.get(id);
  if(!b){msg.textContent=a&&a.exemplo?'Este é um arquivo de exemplo, sem conteúdo. Envie um STL seu no pedido para ver em 3D.':'No protótipo, o arquivo só fica disponível até recarregar a página. Envie de novo para ver em 3D.';return;}
  if(!window.THREE||!window.JSZip){msg.textContent='Não foi possível carregar o visualizador.';return;}
  JSZip.loadAsync(b).then(function(z){
    var f=Object.keys(z.files).filter(function(n){return /\.stl$/i.test(n)&&!z.files[n].dir;})[0];
    if(!f)throw new Error('Nenhum STL dentro do zip.');
    return z.files[f].async('arraybuffer');
  }).then(function(buf){
    var pos=parseSTL(buf); if(!pos.length)throw new Error('Arquivo STL sem triângulos.');
    msg.hidden=true; viewer=montaViewer(pos);
  }).catch(function(e){msg.textContent='Não consegui abrir: '+e.message;});
}
function montaViewer(pos){
  var cv=document.getElementById('v3c'),wrap=document.getElementById('v3');
  var r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  r.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  var scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,1,0.1,1000);
  var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.computeVertexNormals();g.computeBoundingBox();
  var bb=g.boundingBox,ctr=new THREE.Vector3();bb.getCenter(ctr);g.translate(-ctr.x,-ctr.y,-ctr.z);
  var sz=new THREE.Vector3();bb.getSize(sz);var s=2/Math.max(sz.x,sz.y,sz.z);
  var mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xEDE6D8,roughness:.5,metalness:0}));mesh.scale.setScalar(s);
  var grp=new THREE.Group();grp.add(mesh);grp.rotation.x=-0.6;scene.add(grp);
  scene.add(new THREE.HemisphereLight(0xffffff,0x667788,0.8));var dl=new THREE.DirectionalLight(0xffffff,0.8);dl.position.set(2,3,4);cam.add(dl);scene.add(cam);
  cam.position.set(0,0,4.2);
  var run=true,pts={},lastD=0;
  function size(){var w=wrap.clientWidth,h=wrap.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
  size();var ro=window.ResizeObserver?new ResizeObserver(size):null;if(ro)ro.observe(wrap);
  wrap.addEventListener('pointerdown',function(e){pts[e.pointerId]={x:e.clientX,y:e.clientY};wrap.setPointerCapture(e.pointerId);});
  wrap.addEventListener('pointermove',function(e){var p=pts[e.pointerId];if(!p)return;var ids=Object.keys(pts);
    if(ids.length===1){grp.rotation.y+=(e.clientX-p.x)*0.01;grp.rotation.x+=(e.clientY-p.y)*0.01;}
    p.x=e.clientX;p.y=e.clientY;
    if(ids.length===2){var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);if(lastD)cam.position.z=Math.min(12,Math.max(1.5,cam.position.z*lastD/d));lastD=d;}});
  function up(e){delete pts[e.pointerId];lastD=0;}
  wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
  wrap.addEventListener('wheel',function(e){e.preventDefault();cam.position.z=Math.min(12,Math.max(1.5,cam.position.z*(e.deltaY>0?1.1:0.9)));},{passive:false});
  (function loop(){if(!run)return;r.render(scene,cam);requestAnimationFrame(loop);})();
  return {stop:function(){run=false;if(ro)ro.disconnect();g.dispose();r.dispose();viewer=null;}};
}

/* Upload com zip */
function enviaArquivo(pid,file){
  if(!guard())return;
  toast('O envio de STL será liberado em breve. Por enquanto, cole o link do Drive ou WeTransfer no pedido.');var fi=document.getElementById('up-file');if(fi)fi.value='';return;
  var nome=file.name, isZip=/\.zip$/i.test(nome);
  if(!/\.(stl|zip)$/i.test(nome)){toast('Envie um arquivo .stl ou .zip.');return;}
  if(file.size>300*MB){toast('Arquivo maior que 300 MB. Use um link externo.');return;}
  var st=document.getElementById('up-st'),bar=document.getElementById('up-bar'),txt=document.getElementById('up-txt');
  st.hidden=false;txt.textContent=isZip?'Conferindo o zip…':'Compactando '+nome+' ('+bytes(file.size)+')…';
  var p=isZip?Promise.resolve(file):(window.JSZip?(function(){var z=new JSZip();z.file(nome,file);return z.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}},function(m){bar.style.width=m.percent.toFixed(0)+'%';});})():Promise.reject(new Error('compactador não carregou')));
  p.then(function(blob){
    var livre=S.assinatura.limite-usado();
    if(blob.size>livre){st.hidden=true;toast('Sem espaço: faltam '+bytes(blob.size-livre)+'. Apague arquivos ou use um link.');return;}
    var a={id:uid(),pedidoId:pid,origem:'upload',nome:isZip?nome:nome.replace(/\.stl$/i,'')+'.zip',tamOrig:file.size,tamZip:blob.size,criado:today()};
    S.arquivos.push(a);blobs.set(a.id,blob);save();
    toast(isZip?'Zip enviado: '+bytes(blob.size):'Enviado: '+bytes(file.size)+' → '+bytes(blob.size)+' ('+Math.round((1-blob.size/file.size)*100)+'% menor)');
    renderSheet();render();
  }).catch(function(e){st.hidden=true;toast('Não deu para enviar: '+e.message);});
}

var F={

        if(r.error)return fim(msgAuth(r.error));
        if(!r.data.session){ui.loginCriar=false;return fim('Conta criada! Enviamos um e-mail para <b>'+esc(email)+'</b>. Clique no link de confirmação e depois entre aqui. Veja também o spam.');}
        ui.loginBusy=false;});
    }else{
      sb.auth.signInWithPassword({email:email,password:senha}).then(function(r){if(r.error)return fim(msgAuth(r.error));ui.loginBusy=false;});
    }
  },
  novaSenha:function(fd){sb.auth.updateUser({password:String(fd.get('senha')||'')}).then(function(r){if(r.error){toast(msgAuth(r.error));return;}ui.recuperar=false;toast('Senha alterada.');render();});},
  pedido:function(fd,f){
    if(!guard())return;
    var el=(fd.get('elementos')||'').split(',').filter(Boolean).map(Number), t=tipo(fd.get('tipoId'));
    if(t&&t.forma==='elemento'&&!el.length){toast('Marque pelo menos um elemento.');return;}
    var o={clienteId:fd.get('clienteId'),paciente:fd.get('paciente').trim(),tipoId:fd.get('tipoId'),elementos:el,cor:fd.get('cor').trim(),prazo:fd.get('prazo')||null,
      recebido:fd.get('recebido'),urgente:!!fd.get('urgente'),obs:fd.get('obs').trim(),valor:Math.max(0,parseFloat(fd.get('valor'))||0)};
    var id=f.dataset.id,p;
    if(id){p=byId(S.pedidos,id);Object.assign(p,o);}else{p=Object.assign({id:uid(),num:++S.seq,status:'entrada',entregue:null,pago:null,pagamentoId:null},o);S.pedidos.push(p);}
    save();render();openSheet(fPedidoDet,p.id);toast(id?'Pedido salvo.':'Pedido #'+p.num+' criado.');
  },
  cliente:function(fd,f){
    if(!guard())return;
    var o={nome:fd.get('nome').trim(),tipo:fd.get('tipo'),telefone:fd.get('telefone').trim(),email:fd.get('email').trim(),obs:fd.get('obs').trim()};
    var id=f.dataset.id;if(id)Object.assign(cliente(id),o);else{var c=Object.assign({id:uid(),criado:today()},o);S.clientes.push(c);id=c.id;}
    save();closeSheet();ui.tab='clientes';ui.sub=id;render();toast('Cliente salvo.');
  },
  precos:function(fd,f){
    if(!guard())return;var cid=f.dataset.id;
    alive(S.tipos).forEach(function(t){var v=fd.get(t.id);if(v==null)return;var pr=S.precos.filter(function(p){return p.clienteId===cid&&p.tipoId===t.id;})[0];
      if(v===''){if(pr&&!pr.deleted)pr.deleted=today();}else if(pr){pr.valor=+v;pr.deleted=null;}else S.precos.push({id:uid(),clienteId:cid,tipoId:t.id,valor:+v});});
    save();render();toast('Tabela de preços salva.');
  },
  tipo:function(fd,f){
    if(!guard())return;var o={nome:fd.get('nome').trim(),forma:fd.get('forma'),valor:+fd.get('valor')||0,ativo:!!fd.get('ativo')};
    var id=f.dataset.id;if(id)Object.assign(tipo(id),o);else S.tipos.push(Object.assign({id:uid()},o));save();closeSheet();render();toast('Tipo de trabalho salvo.');
  },
  pagamento:function(fd){
    if(!guard())return;var cid=fd.get('clienteId'),ids=fd.getAll('pedidos'),file=fd.get('comprovante');
    var g={id:uid(),clienteId:cid,valor:parseFloat(fd.get('valor'))||0,data:fd.get('data'),forma:fd.get('forma'),obs:(fd.get('obs')||'').trim(),pedidos:ids,
      comprovante:file&&file.size?{nome:file.name,tam:file.size}:null};
    if(g.comprovante&&file.size>10*MB){toast('Comprovante maior que 10 MB.');return;}
    var soma_=soma(ids.map(function(i){return byId(S.pedidos,i);}));
    ids.forEach(function(i){var p=byId(S.pedidos,i);p.pago=g.data;p.pagamentoId=g.id;});
    S.pagamentos.push(g);save();closeSheet();render();
    toast('Pagamento de '+brl(g.valor)+' registrado'+(ids.length?', '+ids.length+' pedido(s) pago(s)':'')+(ids.length&&Math.abs(soma_-g.valor)>0.009?'. Atenção: diferença de '+brl(g.valor-soma_)+' para os pedidos.':'.'));

  pendencia:function(fd,f){

  admPlano:function(fd,f){var gb=Math.max(1,Math.min(1000,parseInt(fd.get('gb'),10)||5));admAltera(f.dataset.id,{novo_plano:fd.get('plano'),novo_limite_bytes:gb*GB},'Plano e espaço atualizados.');},
  link:function(fd,f){
    if(!guard())return;var u=(fd.get('url')||'').trim();if(!/^https?:\/\//i.test(u)){toast('Cole um link que comece com https://');return;}
    var host;try{host=new URL(u).hostname.replace(/^www\./,'');}catch(e){toast('Link inválido.');return;}

  perfil:function(fd){
    if(!guard())return;['nome','telefone','tipoChave','chave','recebedor','cidade'].forEach(function(k){S.perfil[k]=(fd.get(k)||'').trim();});
    if(S.perfil.cidadeGeo&&S.perfil.cidadeGeo.nome!==S.perfil.cidade)S.perfil.cidadeGeo=null;ui.clima=null;ui.climaErr=null;
    var c=S.perfil.chave,t=S.perfil.tipoChave,d=c.replace(/\D/g,'');
    var ok=!c||(t==='cpf'&&d.length===11)||(t==='cnpj'&&d.length===14)||(t==='email'&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c))||(t==='telefone'&&(d.length>=10&&d.length<=13))||(t==='aleatoria'&&c.length>=32);
    save();render();toast(ok?'Configurações salvas.':'Salvo, mas confira a chave Pix: o formato não parece de '+({cpf:'CPF',cnpj:'CNPJ',email:'e-mail',telefone:'celular',aleatoria:'chave aleatória'}[t])+'.');
  },
  faixas:function(fd){
    if(!guard())return;var mins=fd.getAll('min'),pcts=fd.getAll('pct'),fs=[];
    mins.forEach(function(m,i){var mn=parseFloat(m),pc=parseFloat(pcts[i]);if(!isNaN(mn)&&pc>0)fs.push({min:mn,pct:Math.min(90,pc)});});
    S.faixas=fs;save();render();toast('Faixas de desconto salvas.');
  }
};

function msgAuth(e){var m=(e&&e.message)||'';
  if(/Invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar. Procure a mensagem do Ideali CAD na caixa de entrada e no spam.';
  if(/already registered|already been registered/i.test(m))return 'Já existe uma conta com esse e-mail. Use "Já tenho conta" para entrar.';
  if(/Password should be|weak/i.test(m))return 'Senha fraca. Use pelo menos 8 caracteres, misturando letras e números.';
  if(/rate limit|too many/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/fetch|network/i.test(m))return 'Sem conexão com a internet.';
  return 'Não foi possível concluir: '+m;}
function boot(){
  if(location.hash==='#criar'){ui.loginCriar=true;history.replaceState(null,'',location.pathname);}
  if(!sb){document.getElementById('app').innerHTML='<div class="login"><div class="box card" style="padding:24px"><h1>Ideali CAD</h1><p>Não foi possível carregar o sistema. Verifique sua internet e recarregue a página.</p></div></div>';return;}
  sb.auth.onAuthStateChange(function(ev,session){
    if(ev==='PASSWORD_RECOVERY'){ui.recuperar=true;S=estadoVazio();render();return;}
    if(ev==='SIGNED_OUT'){S=estadoVazio();render();return;}
    if(session&&(!S.sessao||S.sessao.id!==session.user.id)&&!ui.recuperar){
      S.sessao={id:session.user.id,email:session.user.email};ui.loginMsg='';ui.tab='dashboard';setTimeout(carregar,0);
    }
  });
  sb.auth.getSession().then(function(r){var se=r.data&&r.data.session;if(!se)render();});
  window.addEventListener('beforeunload',function(e){if(ui.sync==='salvando'){e.preventDefault();e.returnValue='';}});
}
boot();
